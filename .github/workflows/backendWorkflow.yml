name: CI

on:
  # push-trigger enbart på huvudbrancher — feature-brancher körs via sina
  # pull_requests (undviker dubbla körningar per push på öppna PR:er)
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend – bygg & enhetstester
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Build and test with Maven
        run: ./mvnw -B clean verify

      - name: Fail if build changed tracked files
        run: |
          if ! git diff --quiet; then
            echo "ERROR: build modified tracked files."
            git diff --name-only
            exit 1
          fi

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend/target/*.jar

  frontend-checks:
    name: Frontend – lint, audit & produktionsbygge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      # Gate på high/critical. Kända moderate-fynd: postcss <8.5.10 transitivt
      # via next@16.2.6 (GHSA-qx2v-qp2m-jg93) — åtgärdas när Next patchar.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  api-tests:
    name: API-tester (Newman)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Backend/target

      - name: Start backend
        run: |
          java -jar Backend/target/*.jar &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/tasks > /dev/null; then
              echo "Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests (Newman)
        run: npm run test:api

  e2e-tests:
    name: E2E-tester (Playwright mot produktionsbygge)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Inget separat "Start backend"-steg här: Playwrights webServer i
      # playwright.config.ts startar och stänger både backend-jar och
      # Next-produktionsservern (i CI vägrar Playwright återanvända en
      # redan startad server — dubbelstart hade gett portkrock på 8080).
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Backend/target

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  dependency-check:
    name: Säkerhet – OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    # Blockerande gate (failBuildOnCVSS >= 7) sedan NVD_API_KEY finns som
    # repo-secret och beroendena patchats (Spring Boot 3.5.15, log4j 2.25.4).

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            ./mvnw -B -Psecurity dependency-check:check -DnvdApiKey="$NVD_API_KEY"
          else
            ./mvnw -B -Psecurity dependency-check:check
          fi

      - name: Upload OWASP SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Backend/target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload OWASP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: Backend/target/dependency-check-report.html
